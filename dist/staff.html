<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Staff · Bella Vista Oasis Spa</title><link rel="stylesheet" href="style.css"></head><body><main class="page-shell"><a href="/">Bella Vista Oasis Spa</a><h1>Staff dashboard</h1><p id="status" role="status"></p><form id="login"><label>Email<input type="email" id="email" required autocomplete="username"></label><label>Password<input type="password" id="password" required autocomplete="current-password"></label><button class="button dark">Sign in</button></form><form id="set-password" hidden><p>Set a password to activate your staff invitation.</p><label>New password<input type="password" id="new-password" minlength="12" required autocomplete="new-password"></label><button class="button dark">Set password</button></form><div id="dashboard" hidden><button class="button dark" id="logout">Sign out</button><label>Schedule date<input type="date" id="day"></label><button class="button dark" id="refresh">Refresh</button><section><h2>Daily summary</h2><p id="summary"></p></section><section><h2>Appointment calendar</h2><p>Refreshes every 10 seconds. Times are in Asia/Manila; cleaning may continue after closing.</p><div class="table-wrap" id="calendar"></div><h2>Appointment details</h2><div id="appointments"></div></section><section><h2>Therapists</h2><form id="therapist-form"><label>Therapist name<input id="therapist-name" maxlength="120" required></label><button class="button dark">Add therapist</button></form><div id="therapist-list"></div></section><section id="invite-section" hidden><h2>Invite staff</h2><form id="invite-form"><label>Email<input id="invite-email" type="email" required></label><label>Role<select id="invite-role"><option value="staff">Staff</option><option value="admin">Administrator</option></select></label><button class="button dark">Send invitation</button></form></section></div></main><script src="staff.js"></script></body></html>
